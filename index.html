const $=id=>document.getElementById(id);
DATA.forEach((x,i)=>{const b=document.createElement('button');b.className='topic';b.innerHTML='<b></b><span></span>';b.firstChild.textContent=x.t;b.lastChild.textContent=x.d;b.onclick=()=>open_(i);$('list').appendChild(b)});
function open_(i){$('fr').srcdoc=dec(DATA[i].b);$('ttl').textContent=DATA[i].t;$('menu').style.display='none';$('view').style.display='flex';location.hash=i}
$('back').onclick=()=>{$('view').style.display='none';$('menu').style.display='block';$('fr').srcdoc='';history.replaceState(null,'',location.pathname)};
if(location.hash){const i=+location.hash.slice(1);if(DATA[i])open_(i)}
</script></body></html>
